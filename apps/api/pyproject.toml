[project]
name = "nook-api"
version = "1.0.0"
requires-python = ">=3.12"
# Kept in step with requirements.txt (which the Dockerfile installs); tests/test_requirements.py checks they match.
dependencies = [
  "fastapi==0.135.1",
  "uvicorn==0.41.0",
  "sqlalchemy==2.0.48",
  "alembic==1.18.4",
  "psycopg[binary]==3.3.3",
  "pydantic-settings==2.13.1",
  "PyJWT[crypto]==2.12.1",
  "pwdlib[argon2]==0.3.0",
  "jsonschema==4.26.0",
  "python-multipart==0.0.22",
  "pillow==12.1.1",
  "numpy==2.5.4",
  "onnxruntime==1.31.0",
  "httpx==0.28.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths=["tests"]
pythonpath=["."]
[tool.ruff]
line-length=120
[tool.ruff.lint]
select=["E9","F63","F7","F82"]
[tool.mypy]
python_version="3.12"
strict=true
ignore_missing_imports=true
[tool.vercel]
entrypoint = "index:app"
